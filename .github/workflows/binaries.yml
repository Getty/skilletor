name: binaries
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach; empty = probe run
        required: false
  # TEMP (k242): probe runs from ack-paket; drop before merging
  push:
    branches: [ack-paket]
jobs:
  binaries:
    permissions:
      contents: write
    # binary-v1 as of 2026-11-18 (annotated tag 4b56915 -> commit ace48ca)
    uses: Getty/p5-dist-zilla-pluginbundle-author-getty/.github/workflows/dzil-binary.yml@ace48caaecb567990b0e333e4a30737d3e5de3df
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
