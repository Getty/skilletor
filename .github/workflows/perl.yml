# The Perl dist Skilletor (lib/, script/, t/ at the root, a [@Author::GETTY] dist; dist.ini).
# Separate from ci.yml, which builds and tests the TypeScript reference. Node is installed too:
# t/50-parity.t drives the reference in src/ against the port; without node it would skip.
name: Perl

on:
  push:
    # TEMP (k242): probe runs from ack-paket; drop before merging
    branches: [main, ack-paket]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        perl-version: ["5.40"]
    runs-on: ubuntu-latest
    container:
      image: perl:${{ matrix.perl-version }}-bookworm
    env:
      PERL_CPANM_OPT: --mirror https://cpan.metacpan.org --mirror-only
    steps:
      - uses: actions/checkout@v6
      - name: Fix safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - name: Install dependencies
        run: cpanm -nq --installdeps .
      - name: prove
        run: prove -lr -j4 t
