# The Perl dist Skilletor (lib/, script/, t/ at the root, a [@Author::GETTY] dist; dist.ini).
# Separate from ci.yml, which builds and tests the TypeScript reference. Node is installed too:
# t/50-parity.t drives the reference in src/ against the port; without node it would skip.
name: Perl

on:
  push:
    # TEMP (k242): probe runs from ack-paket; drop before merging
    branches: [main, ack-paket]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        perl-version: ["5.40"]
    runs-on: ubuntu-latest
    container:
      image: perl:${{ matrix.perl-version }}-bookworm
    env:
      # Text::Nunjucks is not on CPAN, so CI checks out this immutable revision and adds its lib/
      # (the same commit scripts/binary-prepare.sh installs for the binaries; TEMP, k243).
      TEXT_NUNJUCKS_REPO: Getty/p5-text-nunjucks
      TEXT_NUNJUCKS_REF: 1a9a608ad90270a7ae0d15a92466fc186fda00fd
      PERL_CPANM_OPT: --mirror https://cpan.metacpan.org --mirror-only
    steps:
      - uses: actions/checkout@v6
      - name: Check out Text::Nunjucks (not on CPAN) at the pinned commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TEXT_NUNJUCKS_REPO }}
          ref: ${{ env.TEXT_NUNJUCKS_REF }}
          path: _deps/p5-text-nunjucks
          persist-credentials: false
      - name: Fix safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - name: Put Text::Nunjucks on PERL5LIB
        run: echo "PERL5LIB=$GITHUB_WORKSPACE/_deps/p5-text-nunjucks/lib" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          cpanm -nq --installdeps ./_deps/p5-text-nunjucks
          cpanm -nq --installdeps .
      - name: prove
        run: prove -lr -j4 t
