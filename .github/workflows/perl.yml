# The Perl dist Skilletor (lib/, script/, t/ at the root, a [@Author::GETTY] dist; dist.ini).
# Separate from ci.yml, which builds and tests the TypeScript reference. Since the farewell
# release the dist is stubs only: t/00-stubs.t loads every module and runs the notice, on Linux
# and on Strawberry Perl; workflow_dispatch runs both jobs on any branch.
name: Perl

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        perl-version: ["5.40"]
    runs-on: ubuntu-latest
    container:
      image: perl:${{ matrix.perl-version }}-bookworm
    env:
      PERL_CPANM_OPT: --mirror https://cpan.metacpan.org --mirror-only
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: cpanm -nq --installdeps .
      - name: prove
        run: prove -lr t

  # Windows, Strawberry Perl: the same stub test. The default shell, pwsh, finds setup-perl's
  # perl first (Git Bash would put its own ahead of it); perl -S runs cpanm and prove with that
  # perl.
  load-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PERL_CPANM_OPT: --mirror https://cpan.metacpan.org --mirror-only
    steps:
      - uses: actions/checkout@v6
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
          distribution: strawberry
      - name: Install dependencies
        run: perl -S cpanm -nq --installdeps .
      - name: prove
        run: perl -S prove -lr t
