name: CI

on:
  push:
    # TEMP (k242): probe runs from ack-paket; drop before merging
    branches: [main, ack-paket]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Node 24: the test runner executes .ts directly via native type-stripping.
        # The shipped bundle still targets Node 18 (esbuild target=node18).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check-dist
