# The TypeScript gates on the pinned Bun (k282): frozen install, typecheck, the suite, the dist
# bundle against a rebuild, and on Linux the getty-bun starters against a fresh render
# (scripts/check-starters.mjs, the same check SimpiCI runs from .cicd/).
#
# Decision of the main session (hub task agent-developer k5): ubuntu-latest and windows-latest
# are required. On Windows the Codex hook lines (commandWindows) and the Hermes adapter run
# through getty-bun.ps1 against a ready slot (test/windows-starter.test.ts); the hook handler
# itself (runHook, test/hooks.test.ts) runs there as on Linux. Claude Code's hook lines are not
# run on Windows: hooks/hooks.json starts getty-bun.sh, and test/launcher.test.ts, which runs
# them, skips on win32 because the sh starter does not run there. Their Windows path waits for
# agent-bun-runtime's .cmd polyglot (hub decision F2).
# macos-latest stays in the matrix, advisory (continue-on-error) and expected red, until
# agent-bun-runtime ships a darwin target (hub decision F5); only an advisory leg's name says so.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            advisory: false
          - os: macos-latest
            advisory: true
          - os: windows-latest
            advisory: false
    name: test (${{ matrix.os }})${{ matrix.advisory && ' advisory, expected red' || '' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    steps:
      - uses: actions/checkout@v6
      # package.json gettyBun.bunVersion; the next step fails when the two disagree.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: bun -e "const pin = require('./package.json').gettyBun.bunVersion; if (Bun.version !== pin) { console.error('ci.yml sets up Bun ' + Bun.version + ', package.json gettyBun.bunVersion pins ' + pin); process.exit(1); }"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check-dist
      - if: matrix.os == 'ubuntu-latest'
        run: bun run check-starters
